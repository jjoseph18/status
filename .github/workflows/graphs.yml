name: Graphs CI
on:
  schedule:
    - cron: "0 * * * *"
  repository_dispatch:
    types: [graphs]
  workflow_dispatch:
jobs:
  release:
    name: Generate graphs
    runs-on: ubuntu-latest
    steps:
      - uses: upptime/uptime-monitor@v1.32.1
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
